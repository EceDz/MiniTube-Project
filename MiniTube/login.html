<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8"/>
 <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
 <title>Login to Minitube</title>

 <style>

 *{
  box-sizing:border-box;
  margin:0;
  padding:0;
 }

 body{
  font-family:'Segoe UI',sans-serif;
  background:url('loginspace.png') no-repeat center center fixed;
  background-size:cover;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  justify-content:center;
  min-height:100vh;
  padding-right:15vw;
 }

 .login-container{
  width:100%;
  max-width:400px;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
 }

 .logo{
  display:flex;
  align-items:center;
  gap:16px;
  margin-bottom:36px;
 }

 .logo svg{ width:70px; height:70px; }

 .logo h1{
  font-size:3.5rem;
  font-weight:800;
  letter-spacing:-2px;
  text-shadow:0 4px 12px rgba(0,0,0,0.9);
 }

 .logo span{ color:#ff008caf; }

 .card{
  background:rgba(0,0,0,0.70);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:16px;
  padding:40px 44px;
  width:100%;
  backdrop-filter:blur(12px);
 }

 .tabs{
  display:flex;
  background:rgba(255,255,255,0.07);
  border-radius:8px;
  padding:4px;
  margin-bottom:28px;
 }

 .tab{
  flex:1;
  padding:10px;
  text-align:center;
  border-radius:6px;
  cursor:pointer;
  font-weight:600;
  font-size:0.95rem;
  color:#aaa;
  transition:all 0.2s;
  border:none;
  background:none;
 }

 .tab.active{
  background:#ff008caf;
  color:#fff;
 }

 .panel{ display:none; }
 .panel.active{ display:block; }

 label{
  display:block;
  font-size:0.85rem;
  color:#bbb;
  margin-bottom:7px;
 }

 .field{ margin-bottom:18px; }

 input[type=text],
 input[type=password],
 input[type=email]{
  width:100%;
  padding:12px 16px;
  border-radius:8px;
  border:1px solid rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.08);
  color:#fff;
  font-size:1rem;
  outline:none;
 }

 input:focus{ border-color:#ff008caf; }

 .pw-wrap{ position:relative; }

 .pw-wrap input{ padding-right:68px; }

 .eye{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  background:none;
  border:none;
  color:#ff008caf;
  font-size:0.8rem;
  font-weight:700;
  cursor:pointer;
  white-space:nowrap;
 }

 .btn{
  width:100%;
  padding:13px;
  background:#ff008caf;
  color:#fff;
  border:none;
  border-radius:8px;
  font-size:1.05rem;
  font-weight:700;
  cursor:pointer;
  margin-top:6px;
 }

 .btn:hover{ background:#d4006a; }

 .error-box{
  background:rgba(255,0,0,0.12);
  border:1px solid rgba(255,80,80,0.5);
  color:#ff8888;
  border-radius:8px;
  padding:10px 14px;
  font-size:0.88rem;
  margin-bottom:20px;
  display:none;
 }

 .error-box.show{ display:block; }

 .welcome-screen{
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px 0;
 }

 .welcome-screen.show{ display:flex; }

 .welcome-screen h2{
  font-size:1.9rem;
  font-weight:800;
  margin-bottom:10px;
 }

 .welcome-screen h2 span{ color:#ff008caf; }

 .welcome-screen p{
  color:#aaa;
  font-size:0.9rem;
 }

 </style>
</head>

<body>

<div class="login-container">

 <div class="logo">
  <svg viewBox="0 0 90 90" xmlns="http://www.w3.org/2000/svg">
   <rect width="90" height="90" rx="20" fill="#ff008caf"/>
   <polygon points="35,25 65,45 35,65" fill="#fff"/>
  </svg>
  <h1>Mini<span>Tube</span></h1>
 </div>

 <div class="card">

  <div class="welcome-screen" id="welcome">
   <h2>Hello, <span id="welcome-name"></span>!</h2>
   <p>Redirecting you to your feed...</p>
  </div>

  <div id="form-area">

   <div class="tabs">
    <button class="tab active" id="tab-in" type="button" onclick="show('in')">Sign In</button>
    <button class="tab"        id="tab-up" type="button" onclick="show('up')">Sign Up</button>
   </div>

   <!-- ── SIGN IN ── -->
   <div class="panel active" id="panel-in">

    <div class="error-box" id="err-in"></div>

    <div class="field">
     <label>Username</label>
     <input type="text" id="si-user" placeholder="Enter your username"/>
    </div>

    <div class="field">
     <label>Password</label>
     <div class="pw-wrap">
      <input type="password" id="si-pass" placeholder="Enter your password"/>
      <button class="eye" type="button" onclick="togglePw('si-pass', this)">Show</button>
     </div>
    </div>

    <button class="btn" type="button" onclick="doSignIn()">Sign In</button>

   </div>

   <!-- ── SIGN UP ── -->
   <div class="panel" id="panel-up">

    <div class="error-box" id="err-up"></div>

    <div class="field">
     <label>Full Name</label>
     <input type="text" id="su-name" placeholder="e.g. Ece Duzgec"/>
    </div>

    <div class="field">
     <label>Username</label>
     <input type="text" id="su-user" placeholder="Letters and numbers only"/>
    </div>

    <div class="field">
     <label>Email</label>
     <input type="email" id="su-email" placeholder="example@email.com"/>
    </div>

    <div class="field">
     <label>Country</label>
     <input type="text" id="su-country" placeholder="e.g. Turkey"/>
    </div>

    <div class="field">
     <label>Bio <span style="color:#666;font-weight:400;">(optional)</span></label>
     <input type="text" id="su-bio" placeholder="Tell us something about yourself"/>
    </div>

    <div class="field">
     <label>Password</label>
     <div class="pw-wrap">
      <input type="password" id="su-pass" placeholder="Choose a password (min. 4 characters)"/>
      <button class="eye" type="button" onclick="togglePw('su-pass', this)">Show</button>
     </div>
    </div>

    <button class="btn" type="button" onclick="doSignUp()">Create Account</button>

   </div>

  </div>

 </div>

</div>

<script>

function show(tab){
 ['in','up'].forEach(t => {
  document.getElementById('panel-' + t).classList.toggle('active', t === tab);
  document.getElementById('tab-'   + t).classList.toggle('active', t === tab);
 });
}

function togglePw(id, btn){
 const inp = document.getElementById(id);
 if(inp.type === 'password'){
  inp.type = 'text';
  btn.textContent = 'Hide';
 } else {
  inp.type = 'password';
  btn.textContent = 'Show';
 }
}

function showErr(boxId, msg){
 const el = document.getElementById(boxId);
 el.textContent = msg;
 el.classList.add('show');
}

function clearErr(boxId){
 document.getElementById(boxId).classList.remove('show');
}

function showWelcome(name, user_id){
 document.getElementById('form-area').style.display = 'none';
 document.getElementById('welcome-name').textContent = name;
 document.getElementById('welcome').classList.add('show');
 setTimeout(() => { window.location.href = 'feed.php?user_id=' + user_id; }, 2000);
}

function doSignIn(){
 clearErr('err-in');

 const username = document.getElementById('si-user').value.trim();
 const password = document.getElementById('si-pass').value.trim();

 if(!username || !password){
  showErr('err-in', 'Please fill in all fields.');
  return;
 }

 const fd = new FormData();
 fd.append('action',   'signin');
 fd.append('username', username);
 fd.append('password', password);

 fetch('login.php', { method:'POST', body:fd })
  .then(r => r.json())
  .then(data => {
   if(data.ok){ showWelcome(data.full_name, data.user_id); }
   else        { showErr('err-in', data.error); }
  });
}

function doSignUp(){
 clearErr('err-up');

 const full_name = document.getElementById('su-name').value.trim();
 const username  = document.getElementById('su-user').value.trim();
 const email     = document.getElementById('su-email').value.trim();
 const country   = document.getElementById('su-country').value.trim();
 const bio       = document.getElementById('su-bio').value.trim();
 const password  = document.getElementById('su-pass').value.trim();

 if(!full_name || !username || !email || !country || !password){
  showErr('err-up', 'Please fill in all required fields.');
  return;
 }

 if(!/^[a-zA-Z0-9]+$/.test(username)){
  showErr('err-up', 'Username must contain only letters and numbers.');
  return;
 }

 if(password.length < 4){
  showErr('err-up', 'Password must be at least 4 characters.');
  return;
 }

 const fd = new FormData();
 fd.append('action',    'signup');
 fd.append('full_name', full_name);
 fd.append('username',  username);
 fd.append('email',     email);
 fd.append('country',   country);
 fd.append('bio',       bio);
 fd.append('password',  password);

 fetch('login.php', { method:'POST', body:fd })
  .then(r => r.json())
  .then(data => {
   if(data.ok){ showWelcome(data.full_name, data.user_id); }
   else        { showErr('err-up', data.error); }
  });
}

</script>

</body>
</html>
